# Developer build: shared dashboard plus local credentials.
# Use e1003-release.yaml for the credential-free provisioning proof.
# Build on every platform with:
#   uv run python scripts/build.py compile
packages:
  dashboard: !include e1003-base.yaml

api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${ap_ssid}
    password: !secret ap_password

captive_portal:
