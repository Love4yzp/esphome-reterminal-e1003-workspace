# Canonical open-source firmware.
#
# No Wi-Fi SSID, Wi-Fi password, AP password, API key, or control target is
# compiled into this image. Source builds, tagged releases, and the browser
# installer all use this entry point.

packages:
  dashboard: !include e1003-base.yaml

esphome:
  # Public devices need unique hostnames and setup AP names.
  name_add_mac_suffix: true
  project:
    name: spencer.e1003-dashboard
    version: "1.0"

api:
  # Home Assistant provisions a unique key on first connection.
  encryption:

wifi:
  # Empty AP settings use the final MAC-suffixed device name and no password.
  ap: {}

captive_portal:

improv_serial:
  next_url: https://my.home-assistant.io/redirect/config_flow_start/?domain=esphome

# Keep first-run setup available for a full day. A reboot reopens the window.
# It closes immediately after Wi-Fi and the API encryption key are provisioned.
provisioning:
  timeout: 24h
