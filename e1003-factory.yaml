# Public first-install profile.
#
# No station Wi-Fi, AP password, API key, or control target is compiled into
# this image. The open captive-portal AP is the primary setup path; Improv
# Serial is an additional USB path. Home Assistant provisions a unique API key
# during the first connection.

packages:
  dashboard: !include e1003-base.yaml

substitutions:
  # An empty AP SSID makes ESPHome use the final MAC-suffixed device name.
  status_ap_ssid: ""

esphome:
  name_add_mac_suffix: true
  project:
    name: spencer.e1003-dashboard
    version: "1.0"

api:
  encryption:

wifi:
  # Empty AP settings use the MAC-suffixed device name and no password.
  ap: {}

captive_portal:

improv_serial:
  next_url: https://my.home-assistant.io/redirect/config_flow_start/?domain=esphome

provisioning:
  timeout: 24h
