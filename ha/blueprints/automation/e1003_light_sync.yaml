blueprint:
  name: "E1003: connect one light to the panel"
  description: >-
    Select a Home Assistant light. The automation tells the panel which entity
    to control and mirrors its on/off state and brightness to the e-paper card.
  domain: automation
  input:
    light_entity:
      name: Light to control
      description: Select the Home Assistant light controlled by the panel.
      selector:
        entity:
          domain: light
    panel_target:
      name: Panel target
      description: Select the panel text entity ending in Main light target.
      selector:
        entity:
          domain: text
    panel_state:
      name: Panel state
      description: Select the panel text entity ending in Main light state.
      selector:
        entity:
          domain: text
    panel_value:
      name: Panel brightness
      description: Select the panel text entity ending in Main light value.
      selector:
        entity:
          domain: text

mode: restart

triggers:
  - trigger: state
    entity_id: !input light_entity
  - trigger: homeassistant
    event: start

variables:
  light_entity: !input light_entity

actions:
  - action: text.set_value
    target:
      entity_id: !input panel_target
    data:
      value: "{{ light_entity }}"

  - action: text.set_value
    target:
      entity_id: !input panel_state
    data:
      value: "{{ states(light_entity) }}"

  - action: text.set_value
    target:
      entity_id: !input panel_value
    data:
      value: >-
        {{ ((state_attr(light_entity, 'brightness') or 0) / 2.55)
           | round(0) | int }}
