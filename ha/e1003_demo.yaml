# Optional Home Assistant package for trying the E1003 without a real light.
#
# Copy this file to <config>/packages/e1003_demo.yaml and restart Home
# Assistant. It creates one dimmable virtual light:
#
#   light.e1003_demo_light
#
# Use that light when creating the E1003 light-sync blueprint automation. The
# panel can then control it, and its state/brightness are visible in Home
# Assistant exactly like a physical light.

input_boolean:
  e1003_demo_power:
    name: E1003 demo power
    icon: mdi:lightbulb

input_number:
  e1003_demo_brightness:
    name: E1003 demo brightness
    icon: mdi:brightness-percent
    min: 0
    max: 100
    step: 1
    initial: 65
    mode: slider

template:
  - light:
      - name: E1003 demo light
        unique_id: e1003_demo_light
        icon: mdi:lightbulb-on
        state: "{{ is_state('input_boolean.e1003_demo_power', 'on') }}"
        level: >-
          {{ (states('input_number.e1003_demo_brightness') | int(0) * 2.55)
             | round(0) | int }}

        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.e1003_demo_power

        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.e1003_demo_power

        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.e1003_demo_brightness
            data:
              value: "{{ (brightness / 2.55) | round(0) | int }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.e1003_demo_power
