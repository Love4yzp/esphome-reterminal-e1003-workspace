# =============================================================================
# E1003 dashboard layout -- SINGLE SOURCE OF TRUTH
# =============================================================================
# Every screen coordinate, font choice and touch hit box lives here.
# Nothing in this project is allowed to hardcode a pixel number anymore.
#
#   python tools/layout_to_h.py              # regenerate the two outputs below
#   python tools/layout_to_h.py --check      # validate without writing
#
# Outputs (both generated, never edit by hand):
#   layout/generated/ui_layout.h    C++ geometry consumed by the display lambda
#   layout/generated/fonts.yaml     ESPHome `font:` block consumed by display.yaml
#
# Coordinate conventions
#   cards.*.clear / .fill / .track  ->  {x, y, w, h}  (top-left origin, w/h size)
#   cards.*.anchor                  ->  {x, y}        the text anchor point
#   zones.*.area                    ->  {x1, y1, x2, y2}  INCLUSIVE hit box, in the
#                                       same space as `<canvas width> - touch.x`.
#                                       Verify on the real panel before trusting it.
# =============================================================================

meta:
  canvas:
    width: 1872
    height: 1404

# The approved design bitmap. Regenerate with:
#   python tools/png_to_h.py assets/original.png assets/dashboard_static_v4.h
bitmap:
  header: assets/dashboard_static_v4.h
  symbol: dashboard_v4
  width: 1872
  height: 1404

# Grayscale palette used by the dynamic overlays (16-level e-paper ramp).
palette:
  G2: 225
  G3: 185
  G5: 75

# -----------------------------------------------------------------------------
# FONTS
# -----------------------------------------------------------------------------
# `file` may use substitutions, because the generated fonts.yaml is pulled into
# the ESPHome config where ${font_regular} / ${font_bold} are defined.
# Only declare fonts that are actually referenced by a card below -- every font
# bakes its whole glyph set into flash.
# -----------------------------------------------------------------------------
fonts:
  - { id: font_tiny,   file: "${font_regular}", size: 20 }
  - { id: font_small,  file: "${font_regular}", size: 24 }
  - { id: font_medium, file: "${font_bold}",    size: 36 }
  - { id: font_large,  file: "${font_bold}",    size: 48 }

# -----------------------------------------------------------------------------
# SEMANTIC CONTROLS
# -----------------------------------------------------------------------------
# A control id connects cards and touch zones. ESPHome entity ids belong to the
# interaction module, not to the geometry source.
# -----------------------------------------------------------------------------
controls:
  - main_light

# -----------------------------------------------------------------------------
# TOUCH ZONES
# -----------------------------------------------------------------------------
# op:
#   toggle  call `homeassistant.toggle` on the control's runtime target
#   call    call an explicit light action on the runtime target
#   slider  map a horizontal touch position to a 0-100 control value
#   script  call the dedicated Reachy runtime hook with {zone, action}
#   system  perform a local device action without involving Home Assistant
# The general zone hook replaces direct mode for light zones only.
# -----------------------------------------------------------------------------
zones:
  - id: wifi_reconfigure
    label: "Change the saved Wi-Fi network"
    area: { x1: 1530, y1: 64, x2: 1804, y2: 198 }
    op: system
    data: { action: "wifi_reconfigure" }

  - id: light_off
    label: "Turn main light off"
    control: main_light
    area: { x1: 1507, y1: 508, x2: 1643, y2: 587 }
    op: call
    data: { state: "off" }

  - id: light_on
    label: "Turn main light on"
    control: main_light
    area: { x1: 1644, y1: 508, x2: 1781, y2: 587 }
    op: call
    data: { state: "on" }

  - id: light_25
    label: "Main light 25%"
    control: main_light
    area: { x1: 1245, y1: 681, x2: 1369, y2: 756 }
    op: call
    data: { brightness_pct: "25" }

  - id: light_50
    label: "Main light 50%"
    control: main_light
    area: { x1: 1385, y1: 681, x2: 1509, y2: 756 }
    op: call
    data: { brightness_pct: "50" }

  - id: light_75
    label: "Main light 75%"
    control: main_light
    area: { x1: 1524, y1: 681, x2: 1648, y2: 756 }
    op: call
    data: { brightness_pct: "75" }

  - id: light_100
    label: "Main light 100%"
    control: main_light
    area: { x1: 1664, y1: 681, x2: 1806, y2: 756 }
    op: call
    data: { brightness_pct: "100" }

  - id: light_slider
    label: "Set main light brightness"
    control: main_light
    area: { x1: 1245, y1: 770, x2: 1806, y2: 836 }
    op: slider
    data: { brightness_pct: "touch" }

  - id: reachy_retail_intro
    label: "Reachy retail intro scene"
    area: { x1: 1372, y1: 950, x2: 1507, y2: 1077 }
    op: script
    data: { action: "retail_intro" }

  - id: reachy_space_intro
    label: "Reachy space intro scene"
    area: { x1: 1523, y1: 950, x2: 1660, y2: 1077 }
    op: script
    data: { action: "space_intro" }

  - id: reachy_rescue_intro
    label: "Reachy rescue intro scene"
    area: { x1: 1674, y1: 950, x2: 1810, y2: 1077 }
    op: script
    data: { action: "rescue_intro" }

  - id: reachy_stop
    label: "Stop Reachy scene"
    area: { x1: 1372, y1: 1092, x2: 1507, y2: 1227 }
    op: script
    data: { action: "stop" }

  - id: reachy_wake
    label: "Wake Reachy"
    area: { x1: 1523, y1: 1092, x2: 1660, y2: 1227 }
    op: script
    data: { action: "wake" }

  - id: reachy_language
    label: "Switch Reachy language"
    area: { x1: 1674, y1: 1092, x2: 1810, y2: 1227 }
    op: script
    data: { action: "language" }

# -----------------------------------------------------------------------------
# CARDS  (dynamic regions painted on top of the static bitmap)
# -----------------------------------------------------------------------------
# Each field is cleared to white before it is redrawn, so the refresh only has
# to touch a small local bounding box. `font` must exist in `fonts:` above.
# `source` decides where the value comes from:
#   rtc      local PCF8563 time (short form)
#   sensor   local sensor id declared in packages/hardware.yaml
#   light    the control's state/value supplied through runtime text entities
# -----------------------------------------------------------------------------
cards:
  network:
    fields:
      - id: network_panel
        source: text
        clear: { x: 1525, y: 59, w: 284, h: 298 }
        track: { x: 1530, y: 64, w: 274, h: 134 }
      - id: network_ssid
        source: text
        anchor: { x: 1667, y: 154 }
        align: center
        font: font_small
      - id: network_ip_control
        source: text
        track: { x: 1530, y: 212, w: 274, h: 63 }
      - id: network_ip
        source: text
        anchor: { x: 1667, y: 244 }
        align: center
        font: font_small
      - id: network_ha_control
        source: text
        track: { x: 1530, y: 289, w: 274, h: 63 }
      - id: network_ha
        source: text
        anchor: { x: 1667, y: 321 }
        align: center
        font: font_small

  environment:
    fields:
      - id: env_temperature
        source: sensor
        sensor: sht4x_temperature
        clear: { x: 802, y: 518, w: 57, h: 56 }
        anchor: { x: 830, y: 522 }
        align: top_center
        font: font_large
        format: "%.0f"
      - id: env_humidity
        source: sensor
        sensor: sht4x_humidity
        clear: { x: 1050, y: 518, w: 57, h: 56 }
        anchor: { x: 1078, y: 522 }
        align: top_center
        font: font_large
        format: "%.0f"

  light:
    control: main_light
    fields:
      - id: light_state_control
        source: light_state
        clear: { x: 1503, y: 504, w: 282, h: 88 }
        track: { x: 1507, y: 508, w: 274, h: 79 }
      - id: light_off_label
        source: light_state
        anchor: { x: 1575, y: 548 }
        align: center
        font: font_medium
      - id: light_on_label
        source: light_state
        anchor: { x: 1713, y: 548 }
        align: center
        font: font_medium
      - id: light_current
        source: light_value
        clear: { x: 1644, y: 648, w: 162, h: 30 }
        anchor: { x: 1806, y: 650 }
        align: top_right
        font: font_tiny
      - id: light_preset_25
        source: light_value
        clear: { x: 1242, y: 678, w: 130, h: 82 }
        track: { x: 1245, y: 681, w: 124, h: 75 }
      - id: light_preset_25_label
        source: light_value
        anchor: { x: 1307, y: 719 }
        align: center
        font: font_medium
      - id: light_preset_50
        source: light_value
        clear: { x: 1382, y: 678, w: 130, h: 82 }
        track: { x: 1385, y: 681, w: 124, h: 75 }
      - id: light_preset_50_label
        source: light_value
        anchor: { x: 1447, y: 719 }
        align: center
        font: font_medium
      - id: light_preset_75
        source: light_value
        clear: { x: 1521, y: 678, w: 130, h: 82 }
        track: { x: 1524, y: 681, w: 124, h: 75 }
      - id: light_preset_75_label
        source: light_value
        anchor: { x: 1586, y: 719 }
        align: center
        font: font_medium
      - id: light_preset_100
        source: light_value
        clear: { x: 1661, y: 678, w: 148, h: 82 }
        track: { x: 1664, y: 681, w: 142, h: 75 }
      - id: light_preset_100_label
        source: light_value
        anchor: { x: 1735, y: 719 }
        align: center
        font: font_medium
      - id: light_slider
        source: light_value
        clear: { x: 1242, y: 780, w: 567, h: 45 }
        track: { x: 1260, y: 796, w: 531, h: 11 }

  footer:
    fields:
      - id: footer_time
        source: rtc
        clear: { x: 1706, y: 1324, w: 56, h: 34 }
        anchor: { x: 1734, y: 1327 }
        align: top_center
        font: font_tiny
        format: "%H:%M"

# -----------------------------------------------------------------------------
# REFRESH POLICY
# -----------------------------------------------------------------------------
# DU  = fast 2-level partial refresh, used for text-only overlays
# GC16 = full 16-level grayscale refresh, used for the static bitmap
# -----------------------------------------------------------------------------
refresh:
  boot_mode: GC16
  partial_mode: DU
  full_update_every: 120     # periodic GC16 to clear ghosting buildup
  settle_delay: 250ms        # debounce window before a partial refresh fires
  env_interval: 10min        # low-frequency SHT4x polling for the e-paper UI
