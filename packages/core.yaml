# =============================================================================
# CORE -- identity, platform, network, API, boot sequence
# =============================================================================
# Everything here is device-independent. Tune it from the entry-point YAML
# (e1003-dashboard.yaml) or from the command line:
#     uv run esphome -s device_name my-panel compile e1003-dashboard.yaml
# =============================================================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

  # Files are copied into the build's src/ directory and included by basename.
  # Order matters: the bitmap first, then the header that consumes it.
  includes:
    - assets/dashboard_static_v4.h
    - layout/generated/ui_layout.h
    - src/e1003_render.h

  on_boot:
    priority: -100
    then:
      # Prime the local sensors before the first paint so the dashboard never
      # flashes "--" at the user.
      - component.update: sht4x_sensor
      - pcf8563.read_time:
      - delay: 3s

      # First paint is always a full 16-level grayscale refresh.
      - lambda: |-
          id(ui_full_redraw) = true;
      - it8951.update:
          id: epaper_display
          mode: ${refresh_boot_mode}
      - lambda: |-
          id(ui_ready) = true;

esp32:
  board: ${board}
  framework:
    type: arduino

psram:
  mode: octal

logger:
  hardware_uart: UART0
  level: ${log_level}

# -----------------------------------------------------------------------------
# Home Assistant Native API
# -----------------------------------------------------------------------------
api:
  encryption:
    key: !secret api_encryption_key

# OTA reuses the API encryption key instead of a separate password: one
# credential to rotate, and it saves ~3.5 KB of flash. A bare `encryption:`
# block means "inherit the key from api: above".
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback access point when the configured Wi-Fi is unreachable.
  ap:
    ssid: ${ap_ssid}
    password: !secret ap_password

captive_portal: