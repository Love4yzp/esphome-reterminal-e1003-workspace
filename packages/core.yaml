# =============================================================================
# CORE -- identity and ESP32 platform
# =============================================================================
# Network and security belong to the selected entry-point profile. Tune common
# values from packages/defaults.yaml or from the command line:
#     uv run esphome -s device_name my-panel compile e1003-dashboard.yaml
# =============================================================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: ${board}
  framework:
    type: arduino
    advanced:
      # Hardware boot logs identify the E1003 module's SPI flash as Winbond.
      # Keeping only that vendor driver saves ESP32-S3 IRAM.
      flash_chip: winbond

psram:
  mode: octal

logger:
  hardware_uart: UART0
  level: ${log_level}
