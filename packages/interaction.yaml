# =============================================================================
# INTERACTION -- runtime configuration, touch zones and Home Assistant actions
# =============================================================================

esphome:
  includes:
    - src/e1003_system.h
  on_boot:
    priority: -90
    then:
      - lambda: |-
          id(main_light_command).publish_state("0|idle|0");

globals:
  - id: main_light_command_sequence
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: green_button_hold_triggered
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: wifi_reconfigure_armed
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: light_slider_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: light_slider_touch_id
    type: int
    restore_value: no
    initial_value: '-1'

  - id: light_slider_value
    type: int
    restore_value: no
    initial_value: '0'

text:
  - platform: template
    id: cfg_script_hook
    name: "${friendly_name} Zone script hook"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 63
    initial_value: ""

  - platform: template
    id: cfg_reachy_script_hook
    name: "${friendly_name} Reachy script hook"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 63
    initial_value: ""

  # Optional blueprint-free light control. Empty keeps the default command
  # channel; set to a Home Assistant light entity to call it directly.
  - platform: template
    id: cfg_light_target
    name: "${friendly_name} Light target"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 63
    initial_value: ""

  - platform: template
    id: cfg_state_main_light
    name: "${friendly_name} Main light state"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 31
    initial_value: ""
    on_value:
      then:
        - lambda: |-
            id(ui_light_dirty) = true;
        - script.execute: ui_refresh

  - platform: template
    id: cfg_value_main_light
    name: "${friendly_name} Main light value"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 31
    initial_value: ""
    on_value:
      then:
        - lambda: |-
            id(ui_light_dirty) = true;
        - script.execute: ui_refresh

text_sensor:
  # Read-only command channel consumed by the HA blueprint. A sequence prefix
  # makes repeated taps of the same control produce distinct state changes.
  - platform: template
    id: main_light_command
    name: "${friendly_name} Main light command"
    icon: mdi:gesture-tap-button
    update_interval: never

binary_sensor:
  - platform: gpio
    id: button_green
    internal: true
    pin:
      number: ${pin_button_green}
      mode:
        input: true
        pullup: true
      inverted: true
      # GPIO3 is a strapping pin, but it is the board's dedicated green key.
      ignore_strapping_warning: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - lambda: |-
            id(green_button_hold_triggered) = false;
        - script.execute: green_button_hold
    on_release:
      then:
        - if:
            condition:
              lambda: |-
                return !id(green_button_hold_triggered);
            then:
              - script.stop: green_button_hold
              - script.execute: ui_beep
              - script.execute: ui_repaint

touchscreen:
  - platform: gt911
    id: e1003_touch
    display: epaper_display
    interrupt_pin: ${pin_touch_int}
    reset_pin: ${pin_touch_rst}

    transform:
      mirror_x: true

    on_touch:
      - lambda: |-
          const int x = ${canvas_width} - touch.x;
          const int y = touch.y;
          ESP_LOGI("e1003", "Touch x=%d y=%d", x, y);

          for (const auto &zone : e1003::ZONES) {
            if (x < zone.area.x1 || x > zone.area.x2) continue;
            if (y < zone.area.y1 || y > zone.area.y2) continue;

            if (zone.op == e1003::ZoneOp::SLIDER) {
              const int span = zone.area.x2 - zone.area.x1;
              const int position = x - zone.area.x1;
              id(light_slider_active) = true;
              id(light_slider_touch_id) = touch.id;
              id(light_slider_value) =
                  (position * 100 + span / 2) / span;
              ESP_LOGI("e1003", "slider '%s' start=%d%%",
                       zone.id, id(light_slider_value));
              return;
            }

            ESP_LOGI("e1003", "zone '%s' op=%d", zone.id, (int) zone.op);

            id(zone_dispatch)->execute(
                std::string(zone.id),
                zone.control != nullptr ? std::string(zone.control) : std::string(),
                (int) zone.op,
                zone.data_key != nullptr ? std::string(zone.data_key) : std::string(),
                zone.data_value != nullptr ? std::string(zone.data_value) : std::string());
            return;
          }

    on_update:
      - lambda: |-
          if (!id(light_slider_active)) return;

          for (const auto &touch : touches) {
            if (touch.id != id(light_slider_touch_id) || touch.state > 2) continue;

            const int x = ${canvas_width} - touch.x;
            for (const auto &zone : e1003::ZONES) {
              if (zone.op != e1003::ZoneOp::SLIDER) continue;

              const int clamped_x = x < zone.area.x1
                  ? zone.area.x1
                  : (x > zone.area.x2 ? zone.area.x2 : x);
              const int span = zone.area.x2 - zone.area.x1;
              const int position = clamped_x - zone.area.x1;
              id(light_slider_value) =
                  (position * 100 + span / 2) / span;
              return;
            }
          }

    on_release:
      - lambda: |-
          if (!id(light_slider_active)) return;

          id(light_slider_active) = false;
          id(light_slider_touch_id) = -1;

          for (const auto &zone : e1003::ZONES) {
            if (zone.op != e1003::ZoneOp::SLIDER) continue;

            const std::string value = std::to_string(id(light_slider_value));

            ESP_LOGI("e1003", "slider '%s' commit=%s%%",
                     zone.id, value.c_str());
            id(zone_dispatch)->execute(
                std::string(zone.id),
                zone.control != nullptr ? std::string(zone.control) : std::string(),
                (int) zone.op,
                zone.data_key != nullptr ? std::string(zone.data_key) : std::string(),
                value);
            return;
          }

script:
  - id: green_button_hold
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            binary_sensor.is_on: button_green
          then:
            - lambda: |-
                id(green_button_hold_triggered) = true;
            - script.execute: ui_beep_long
            - script.wait: ui_beep_long
            - lambda: |-
                App.safe_reboot();

  - id: wifi_reconfigure_disarm
    mode: restart
    then:
      - delay: 8s
      - lambda: |-
          id(wifi_reconfigure_armed) = false;
          id(ui_network_dirty) = true;
      - script.execute: ui_refresh

  - id: wifi_reconfigure_touch
    mode: queued
    max_runs: 2
    then:
      - if:
          condition:
            lambda: |-
              return wifi::global_wifi_component != nullptr
                  && !wifi::global_wifi_component->is_ap_active();
          then:
            - if:
                condition:
                  lambda: |-
                    return id(wifi_reconfigure_armed);
                then:
                  - script.stop: wifi_reconfigure_disarm
                  - lambda: |-
                      id(wifi_reconfigure_armed) = false;
                  - script.execute: ui_beep_warning
                  - script.wait: ui_beep_warning
                  - if:
                      condition:
                        lambda: |-
                          return e1003::clear_wifi_credentials();
                      then:
                        - lambda: |-
                            App.safe_reboot();
                      else:
                        - lambda: |-
                            id(ui_network_dirty) = true;
                        - script.execute: ui_refresh
                else:
                  - script.execute: ui_beep
                  - lambda: |-
                      id(wifi_reconfigure_armed) = true;
                      id(ui_network_dirty) = true;
                  - script.execute: ui_refresh
                  - script.execute: wifi_reconfigure_disarm

  - id: zone_dispatch
    mode: queued
    max_runs: 4
    parameters:
      zone_id: string
      control: string
      op: int
      data_name: string
      data_value: string
    then:
      - if:
          condition:
            lambda: |-
              return op == (int) e1003::ZoneOp::SYSTEM
                  && data_name == "action"
                  && data_value == "wifi_reconfigure";
          then:
            - script.execute: wifi_reconfigure_touch

      - if:
          condition:
            lambda: |-
              return op != (int) e1003::ZoneOp::SYSTEM;
          then:
            - script.execute: ui_beep

      # Reflect the user's light intent immediately. Home Assistant's mirrored
      # state remains authoritative and can correct this optimistic value.
      - lambda: |-
          const bool is_call = op == (int) e1003::ZoneOp::CALL;
          const bool is_slider = op == (int) e1003::ZoneOp::SLIDER;
          if (!is_call && !is_slider) return;

          if (data_name == "state"
              && (data_value == "on" || data_value == "off")) {
            if (id(cfg_state_main_light).state != data_value) {
              id(cfg_state_main_light).publish_state(data_value);
            }
            return;
          }

          if (data_name != "brightness_pct") return;

          int value = 0;
          for (const char c : data_value) {
            if (c < '0' || c > '9') break;
            value = value * 10 + (c - '0');
          }
          if (value > 100) value = 100;

          const std::string normalized = std::to_string(value);
          if (id(cfg_value_main_light).state != normalized) {
            id(cfg_value_main_light).publish_state(normalized);
          }

          const std::string next_state = value == 0 ? "off" : "on";
          if (id(cfg_state_main_light).state != next_state) {
            id(cfg_state_main_light).publish_state(next_state);
          }

      - if:
          condition:
            lambda: |-
              return op == (int) e1003::ZoneOp::SCRIPT
                  && !id(cfg_reachy_script_hook).state.empty();
          then:
            - homeassistant.action:
                action: !lambda |-
                  return id(cfg_reachy_script_hook).state;
                data_template:
                  zone: !lambda |-
                    return zone_id;
                  action: !lambda |-
                    return data_value;

      # Light dispatch, in priority order:
      #   1. light_target set  -> direct service call, no automation needed;
      #   2. zone_script_hook   -> one advanced HA action for every zone;
      #   3. otherwise          -> publish a command for the HA blueprint.
      # The default (3) stays permission-free and keeps entity ids out of the
      # firmware; (1) and (2) need "Allow the device to perform Home Assistant
      # actions" in the Home Assistant ESPHome integration.
      - if:
          condition:
            lambda: |-
              return control == "main_light"
                  && (op == (int) e1003::ZoneOp::TOGGLE
                      || op == (int) e1003::ZoneOp::CALL
                      || op == (int) e1003::ZoneOp::SLIDER);
          then:
            - if:
                condition:
                  lambda: |-
                    return !id(cfg_light_target).state.empty();
                then:
                  - if:
                      condition:
                        lambda: |-
                          return op == (int) e1003::ZoneOp::TOGGLE;
                      then:
                        - homeassistant.action:
                            action: light.toggle
                            data_template:
                              entity_id: !lambda |-
                                return id(cfg_light_target).state;
                      else:
                        - if:
                            condition:
                              lambda: |-
                                return data_name == "state"
                                    && data_value == "off";
                            then:
                              - homeassistant.action:
                                  action: light.turn_off
                                  data_template:
                                    entity_id: !lambda |-
                                      return id(cfg_light_target).state;
                            else:
                              - if:
                                  condition:
                                    lambda: |-
                                      return data_name == "state";
                                  then:
                                    - homeassistant.action:
                                        action: light.turn_on
                                        data_template:
                                          entity_id: !lambda |-
                                            return id(cfg_light_target).state;
                                  else:
                                    - if:
                                        condition:
                                          lambda: |-
                                            int value = 0;
                                            for (const char c : data_value) {
                                              if (c < '0' || c > '9') break;
                                              value = value * 10 + (c - '0');
                                            }
                                            return value > 0;
                                        then:
                                          - homeassistant.action:
                                              action: light.turn_on
                                              data_template:
                                                entity_id: !lambda |-
                                                  return id(cfg_light_target).state;
                                                brightness_pct: !lambda |-
                                                  return data_value;
                                        else:
                                          - homeassistant.action:
                                              action: light.turn_off
                                              data_template:
                                                entity_id: !lambda |-
                                                  return id(cfg_light_target).state;
                else:
                  - if:
                      condition:
                        lambda: |-
                          return !id(cfg_script_hook).state.empty();
                      then:
                        - homeassistant.action:
                            action: !lambda |-
                              return id(cfg_script_hook).state;
                            data_template:
                              zone: !lambda |-
                                return zone_id;
                              control: !lambda |-
                                return control;
                              data_name: !lambda |-
                                return data_name;
                              data_value: !lambda |-
                                return data_value;
                      else:
                        - lambda: |-
                            id(main_light_command_sequence)++;
                            const std::string command =
                                std::to_string(id(main_light_command_sequence))
                                + "|" + data_name + "|" + data_value;
                            ESP_LOGI("e1003", "publish main light command '%s'",
                                     command.c_str());
                            id(main_light_command).publish_state(command);

api:
  actions:
    - action: repaint
      then:
        - script.execute: ui_repaint

    - action: beep
      then:
        - script.execute: ui_beep
