# =============================================================================
# INTERACTION -- runtime configuration, touch zones and Home Assistant actions
# =============================================================================

text:
  - platform: template
    id: cfg_script_hook
    name: "${friendly_name} Zone script hook"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 63
    initial_value: ""

  - platform: template
    id: cfg_reachy_script_hook
    name: "${friendly_name} Reachy script hook"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 63
    initial_value: ""

  - platform: template
    id: cfg_target_main_light
    name: "${friendly_name} Main light target"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 63
    initial_value: "${default_light_target}"
    on_value:
      then:
        - lambda: |-
            id(ui_light_dirty) = true;
        - script.execute: ui_refresh

  - platform: template
    id: cfg_state_main_light
    name: "${friendly_name} Main light state"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 31
    initial_value: ""
    on_value:
      then:
        - lambda: |-
            id(ui_light_dirty) = true;
        - script.execute: ui_refresh

  - platform: template
    id: cfg_value_main_light
    name: "${friendly_name} Main light value"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 31
    initial_value: ""
    on_value:
      then:
        - lambda: |-
            id(ui_light_dirty) = true;
        - script.execute: ui_refresh

touchscreen:
  - platform: gt911
    id: e1003_touch
    display: epaper_display
    interrupt_pin: ${pin_touch_int}
    reset_pin: ${pin_touch_rst}

    transform:
      mirror_x: true

    on_touch:
      - lambda: |-
          const int x = ${canvas_width} - touch.x;
          const int y = touch.y;
          ESP_LOGI("e1003", "Touch x=%d y=%d", x, y);

          for (const auto &zone : e1003::ZONES) {
            if (x < zone.area.x1 || x > zone.area.x2) continue;
            if (y < zone.area.y1 || y > zone.area.y2) continue;

            const std::string target = zone.control != nullptr
                && strcmp(zone.control, "main_light") == 0
              ? id(cfg_target_main_light).state
              : std::string();

            ESP_LOGI("e1003", "zone '%s' op=%d target='%s'", zone.id,
                     (int) zone.op, target.c_str());

            id(zone_dispatch)->execute(
                std::string(zone.id),
                zone.control != nullptr ? std::string(zone.control) : std::string(),
                target,
                (int) zone.op,
                zone.data_key != nullptr ? std::string(zone.data_key) : std::string(),
                zone.data_value != nullptr ? std::string(zone.data_value) : std::string());
            return;
          }

script:
  - id: zone_dispatch
    mode: queued
    max_runs: 4
    parameters:
      zone_id: string
      control: string
      target: string
      op: int
      data_name: string
      data_value: string
    then:
      - script.execute: ui_beep

      - if:
          condition:
            lambda: |-
              return op == 2 && !id(cfg_reachy_script_hook).state.empty();
          then:
            - homeassistant.action:
                action: !lambda |-
                  return id(cfg_reachy_script_hook).state;
                data_template:
                  zone: !lambda |-
                    return zone_id;
                  action: !lambda |-
                    return data_value;

      - if:
          condition:
            lambda: |-
              return op != 2;
          then:
            - if:
                condition:
                  lambda: |-
                    return !id(cfg_script_hook).state.empty();
                then:
                  - homeassistant.action:
                      action: !lambda |-
                        return id(cfg_script_hook).state;
                      data_template:
                        zone: !lambda |-
                          return zone_id;
                        control: !lambda |-
                          return control;
                        data_name: !lambda |-
                          return data_name;
                        data_value: !lambda |-
                          return data_value;
                else:
                  - if:
                      condition:
                        lambda: |-
                          return op == 0 && !target.empty();
                      then:
                        - homeassistant.action:
                            action: homeassistant.toggle
                            data_template:
                              entity_id: !lambda |-
                                return target;

                  - if:
                      condition:
                        lambda: |-
                          return op == 1 && data_name == "state"
                              && data_value == "off" && !target.empty();
                      then:
                        - homeassistant.action:
                            action: light.turn_off
                            data_template:
                              entity_id: !lambda |-
                                return target;

                  - if:
                      condition:
                        lambda: |-
                          return op == 1 && data_name == "state"
                              && data_value == "on" && !target.empty();
                      then:
                        - homeassistant.action:
                            action: light.turn_on
                            data_template:
                              entity_id: !lambda |-
                                return target;

                  - if:
                      condition:
                        lambda: |-
                          return op == 1 && data_name == "brightness_pct"
                              && !target.empty();
                      then:
                        - homeassistant.action:
                            action: light.turn_on
                            data_template:
                              entity_id: !lambda |-
                                return target;
                              brightness_pct: !lambda |-
                                return data_value;

api:
  actions:
    - action: repaint
      then:
        - script.execute: ui_repaint

    - action: beep
      then:
        - script.execute: ui_beep
