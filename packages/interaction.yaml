# =============================================================================
# INTERACTION -- runtime configuration, touch zones and Home Assistant actions
# =============================================================================

esphome:
  includes:
    - src/e1003_system.h

globals:
  - id: green_button_hold_triggered
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: wifi_reconfigure_armed
    type: bool
    restore_value: no
    initial_value: 'false'

text:
  - platform: template
    id: cfg_script_hook
    name: "${friendly_name} Zone script hook"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 63
    initial_value: ""

  - platform: template
    id: cfg_reachy_script_hook
    name: "${friendly_name} Reachy script hook"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 63
    initial_value: ""

  - platform: template
    id: cfg_target_main_light
    name: "${friendly_name} Main light target"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 63
    initial_value: "${default_light_target}"
    on_value:
      then:
        - lambda: |-
            id(ui_light_dirty) = true;
        - script.execute: ui_refresh

  - platform: template
    id: cfg_state_main_light
    name: "${friendly_name} Main light state"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 31
    initial_value: ""
    on_value:
      then:
        - lambda: |-
            id(ui_light_dirty) = true;
        - script.execute: ui_refresh

  - platform: template
    id: cfg_value_main_light
    name: "${friendly_name} Main light value"
    mode: text
    optimistic: true
    restore_value: true
    max_length: 31
    initial_value: ""
    on_value:
      then:
        - lambda: |-
            id(ui_light_dirty) = true;
        - script.execute: ui_refresh

binary_sensor:
  - platform: gpio
    id: button_green
    internal: true
    pin:
      number: ${pin_button_green}
      mode:
        input: true
        pullup: true
      inverted: true
      # GPIO3 is a strapping pin, but it is the board's dedicated green key.
      ignore_strapping_warning: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - lambda: |-
            id(green_button_hold_triggered) = false;
        - script.execute: green_button_hold
    on_release:
      then:
        - if:
            condition:
              lambda: |-
                return !id(green_button_hold_triggered);
            then:
              - script.stop: green_button_hold
              - script.execute: ui_beep
              - script.execute: ui_repaint

touchscreen:
  - platform: gt911
    id: e1003_touch
    display: epaper_display
    interrupt_pin: ${pin_touch_int}
    reset_pin: ${pin_touch_rst}

    transform:
      mirror_x: true

    on_touch:
      - lambda: |-
          const int x = ${canvas_width} - touch.x;
          const int y = touch.y;
          ESP_LOGI("e1003", "Touch x=%d y=%d", x, y);

          for (const auto &zone : e1003::ZONES) {
            if (x < zone.area.x1 || x > zone.area.x2) continue;
            if (y < zone.area.y1 || y > zone.area.y2) continue;

            const std::string target = zone.control != nullptr
                && strcmp(zone.control, "main_light") == 0
              ? id(cfg_target_main_light).state
              : std::string();

            ESP_LOGI("e1003", "zone '%s' op=%d target='%s'", zone.id,
                     (int) zone.op, target.c_str());

            id(zone_dispatch)->execute(
                std::string(zone.id),
                zone.control != nullptr ? std::string(zone.control) : std::string(),
                target,
                (int) zone.op,
                zone.data_key != nullptr ? std::string(zone.data_key) : std::string(),
                zone.data_value != nullptr ? std::string(zone.data_value) : std::string());
            return;
          }

script:
  - id: green_button_hold
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            binary_sensor.is_on: button_green
          then:
            - lambda: |-
                id(green_button_hold_triggered) = true;
            - script.execute: ui_beep_long
            - script.wait: ui_beep_long
            - lambda: |-
                App.safe_reboot();

  - id: wifi_reconfigure_disarm
    mode: restart
    then:
      - delay: 8s
      - lambda: |-
          id(wifi_reconfigure_armed) = false;
          id(ui_network_dirty) = true;
      - script.execute: ui_refresh

  - id: wifi_reconfigure_touch
    mode: queued
    max_runs: 2
    then:
      - if:
          condition:
            lambda: |-
              return wifi::global_wifi_component != nullptr
                  && !wifi::global_wifi_component->is_ap_active();
          then:
            - if:
                condition:
                  lambda: |-
                    return id(wifi_reconfigure_armed);
                then:
                  - script.stop: wifi_reconfigure_disarm
                  - lambda: |-
                      id(wifi_reconfigure_armed) = false;
                  - script.execute: ui_beep_warning
                  - script.wait: ui_beep_warning
                  - if:
                      condition:
                        lambda: |-
                          return e1003::clear_wifi_credentials();
                      then:
                        - lambda: |-
                            App.safe_reboot();
                      else:
                        - lambda: |-
                            id(ui_network_dirty) = true;
                        - script.execute: ui_refresh
                else:
                  - script.execute: ui_beep
                  - lambda: |-
                      id(wifi_reconfigure_armed) = true;
                      id(ui_network_dirty) = true;
                  - script.execute: ui_refresh
                  - script.execute: wifi_reconfigure_disarm

  - id: zone_dispatch
    mode: queued
    max_runs: 4
    parameters:
      zone_id: string
      control: string
      target: string
      op: int
      data_name: string
      data_value: string
    then:
      - if:
          condition:
            lambda: |-
              return op == 3 && data_name == "action"
                  && data_value == "wifi_reconfigure";
          then:
            - script.execute: wifi_reconfigure_touch

      - if:
          condition:
            lambda: |-
              return op != 3;
          then:
            - script.execute: ui_beep

      - if:
          condition:
            lambda: |-
              return op == 2 && !id(cfg_reachy_script_hook).state.empty();
          then:
            - homeassistant.action:
                action: !lambda |-
                  return id(cfg_reachy_script_hook).state;
                data_template:
                  zone: !lambda |-
                    return zone_id;
                  action: !lambda |-
                    return data_value;

      - if:
          condition:
            lambda: |-
              return op < 2;
          then:
            - if:
                condition:
                  lambda: |-
                    return !id(cfg_script_hook).state.empty();
                then:
                  - homeassistant.action:
                      action: !lambda |-
                        return id(cfg_script_hook).state;
                      data_template:
                        zone: !lambda |-
                          return zone_id;
                        control: !lambda |-
                          return control;
                        data_name: !lambda |-
                          return data_name;
                        data_value: !lambda |-
                          return data_value;
                else:
                  - if:
                      condition:
                        lambda: |-
                          return op == 0 && !target.empty();
                      then:
                        - homeassistant.action:
                            action: homeassistant.toggle
                            data_template:
                              entity_id: !lambda |-
                                return target;

                  - if:
                      condition:
                        lambda: |-
                          return op == 1 && data_name == "state"
                              && data_value == "off" && !target.empty();
                      then:
                        - homeassistant.action:
                            action: light.turn_off
                            data_template:
                              entity_id: !lambda |-
                                return target;

                  - if:
                      condition:
                        lambda: |-
                          return op == 1 && data_name == "state"
                              && data_value == "on" && !target.empty();
                      then:
                        - homeassistant.action:
                            action: light.turn_on
                            data_template:
                              entity_id: !lambda |-
                                return target;

                  - if:
                      condition:
                        lambda: |-
                          return op == 1 && data_name == "brightness_pct"
                              && !target.empty();
                      then:
                        - homeassistant.action:
                            action: light.turn_on
                            data_template:
                              entity_id: !lambda |-
                                return target;
                              brightness_pct: !lambda |-
                                return data_value;

api:
  actions:
    - action: repaint
      then:
        - script.execute: ui_repaint

    - action: beep
      then:
        - script.execute: ui_beep
