# =============================================================================
# UI -- boot paint, refresh state machine and IT8951 render pass
# =============================================================================

esphome:
  # Files are copied into the build's src/ directory and included by basename.
  # Order matters: the bitmap first, then the header that consumes it.
  includes:
    - assets/dashboard_static_v4.h
    - layout/generated/ui_layout.h
    - src/e1003_render.h

  on_boot:
    priority: -100
    then:
      - component.update: sht4x_sensor
      - pcf8563.read_time:
      - delay: 3s
      - lambda: |-
          id(ui_full_redraw) = true;
      - it8951.update:
          id: epaper_display
          mode: ${refresh_boot_mode}
      - lambda: |-
          id(ui_ready) = true;

globals:
  - id: ui_ready
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ui_full_redraw
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: ui_time_dirty
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ui_env_dirty
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ui_light_dirty
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  # Sources mark a card dirty and call this script. Restart mode merges bursts
  # into one partial panel refresh.
  - id: ui_refresh
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_ready) && !id(ui_full_redraw);
          then:
            - delay: ${refresh_settle_delay}
            - it8951.update:
                id: epaper_display
                mode: ${refresh_partial_mode}

  - id: ui_beep
    mode: restart
    then:
      - light.turn_on:
          id: ui_buzzer
          brightness: ${beep_brightness}
      - delay: ${beep_duration}
      - light.turn_off: ui_buzzer

  - id: ui_repaint
    mode: restart
    then:
      - lambda: |-
          id(ui_full_redraw) = true;
      - it8951.update:
          id: epaper_display
          mode: ${refresh_boot_mode}

# The font list is generated from layout/ui_layout.yaml.
packages:
  fonts: !include ../layout/generated/fonts.yaml

display:
  - platform: it8951
    id: epaper_display
    spi_id: epaper_spi_bus
    model: ${epaper_model}

    update_interval: never
    auto_clear_enabled: false
    grayscale: true
    dithering: false
    update_mode: ${refresh_boot_mode}
    full_update_every: ${refresh_full_update_every}

    transform:
      mirror_x: true
      mirror_y: false

    lambda: |-
      static const Color BLACK = Color::BLACK;
      static const Color WHITE = Color::WHITE;
      const Color G3 = Color(e1003::G3, e1003::G3, e1003::G3);

      auto clear = [&](const e1003::Rect &r) {
        it.filled_rectangle(r.x, r.y, r.w, r.h, WHITE);
      };

      auto parse_uint = [](const std::string &text) -> int {
        int value = 0;
        for (const char c : text) {
          if (c < '0' || c > '9') break;
          value = value * 10 + (c - '0');
          if (value > 1000) break;
        }
        return value;
      };

      auto light_configured = [&]() -> bool {
        return !id(cfg_target_main_light).state.empty();
      };

      auto light_on = [&]() -> bool {
        return id(cfg_state_main_light).state == "on";
      };

      auto light_pct = [&]() -> int {
        const std::string value_text = id(cfg_value_main_light).state;
        if (value_text.empty()) return 0;
        const int value = parse_uint(value_text);
        return value > 100 ? 100 : value;
      };

      auto clock_message = [&]() -> std::string {
        const std::string override_message = id(cfg_message).state;
        if (!override_message.empty()) {
          return override_message;
        }
        auto now = id(rtc_time).now();
        if (!now.is_valid()) return "";
        return now.hour < 12 ? "Good Morning"
             : now.hour < 18 ? "Good Afternoon"
                             : "Good Evening";
      };

      auto draw_clock = [&]() {
        clear(e1003::CLOCK_CLEAR);

        auto now = id(rtc_time).now();
        if (now.is_valid()) {
          it.strftime(e1003::CLOCK_DATE_ANCHOR.x, e1003::CLOCK_DATE_ANCHOR.y,
                      id(font_medium), BLACK,
                      e1003::CLOCK_DATE_ALIGN, e1003::CLOCK_DATE_FORMAT, now);

          it.strftime(e1003::CLOCK_TIME_ANCHOR.x, e1003::CLOCK_TIME_ANCHOR.y,
                      id(font_number), BLACK,
                      e1003::CLOCK_TIME_ALIGN, e1003::CLOCK_TIME_FORMAT, now);
        }

        const std::string message = clock_message();
        if (!message.empty()) {
          it.printf(e1003::CLOCK_MESSAGE_ANCHOR.x, e1003::CLOCK_MESSAGE_ANCHOR.y,
                    id(font_medium), BLACK,
                    e1003::CLOCK_MESSAGE_ALIGN, "%s", message.c_str());
        }
      };

      auto draw_environment = [&]() {
        clear(e1003::ENV_TEMPERATURE_CLEAR);
        if (id(sht4x_temperature).has_state()) {
          it.printf(e1003::ENV_TEMPERATURE_ANCHOR.x, e1003::ENV_TEMPERATURE_ANCHOR.y,
                    id(font_large), BLACK,
                    e1003::ENV_TEMPERATURE_ALIGN, e1003::ENV_TEMPERATURE_FORMAT,
                    id(sht4x_temperature).state);
        } else {
          it.printf(e1003::ENV_TEMPERATURE_ANCHOR.x, e1003::ENV_TEMPERATURE_ANCHOR.y,
                    id(font_large), BLACK,
                    e1003::ENV_TEMPERATURE_ALIGN, "%s", "--");
        }

        clear(e1003::ENV_HUMIDITY_CLEAR);
        if (id(sht4x_humidity).has_state()) {
          it.printf(e1003::ENV_HUMIDITY_ANCHOR.x, e1003::ENV_HUMIDITY_ANCHOR.y,
                    id(font_large), BLACK,
                    e1003::ENV_HUMIDITY_ALIGN, e1003::ENV_HUMIDITY_FORMAT,
                    id(sht4x_humidity).state);
        } else {
          it.printf(e1003::ENV_HUMIDITY_ANCHOR.x, e1003::ENV_HUMIDITY_ANCHOR.y,
                    id(font_large), BLACK,
                    e1003::ENV_HUMIDITY_ALIGN, "%s", "--");
        }
      };

      auto draw_light = [&]() {
        const bool configured = light_configured();
        const bool on = light_on();
        const int pct = light_pct();

        clear(e1003::LIGHT_STATE_TEXT_CLEAR);
        it.printf(e1003::LIGHT_STATE_TEXT_ANCHOR.x, e1003::LIGHT_STATE_TEXT_ANCHOR.y,
                  id(font_medium), BLACK,
                  e1003::LIGHT_STATE_TEXT_ALIGN, "%s",
                  configured ? (on ? "On" : "Off") : "Setup");

        clear(e1003::LIGHT_BUTTON_CLEAR);
        const e1003::Rect button = e1003::LIGHT_BUTTON_FILL;
        if (configured && on) {
          it.filled_rectangle(button.x, button.y, button.w, button.h, BLACK);
          it.printf(e1003::LIGHT_BUTTON_ANCHOR.x, e1003::LIGHT_BUTTON_ANCHOR.y,
                    id(font_large), WHITE,
                    e1003::LIGHT_BUTTON_ALIGN, "%s", "On");
        } else {
          it.rectangle(button.x, button.y, button.w, button.h, G3);
          it.printf(e1003::LIGHT_BUTTON_ANCHOR.x, e1003::LIGHT_BUTTON_ANCHOR.y,
                    id(font_large), BLACK,
                    e1003::LIGHT_BUTTON_ALIGN, "%s", configured ? "Off" : "--");
        }

        clear(e1003::LIGHT_VALUE_CLEAR);
        if (configured) {
          it.printf(e1003::LIGHT_VALUE_ANCHOR.x, e1003::LIGHT_VALUE_ANCHOR.y,
                    id(font_medium), BLACK,
                    e1003::LIGHT_VALUE_ALIGN, e1003::LIGHT_VALUE_FORMAT, pct);
        } else {
          it.printf(e1003::LIGHT_VALUE_ANCHOR.x, e1003::LIGHT_VALUE_ANCHOR.y,
                    id(font_medium), BLACK,
                    e1003::LIGHT_VALUE_ALIGN, "%s", "--");
        }

        clear(e1003::LIGHT_BAR_CLEAR);
        const e1003::Rect track = e1003::LIGHT_BAR_TRACK;
        const int filled = track.w * pct / 100;
        if (configured && filled > 0) {
          it.filled_rectangle(track.x, track.y, filled, track.h, BLACK);
        }
      };

      auto draw_footer = [&]() {
        clear(e1003::FOOTER_TIME_CLEAR);

        auto now = id(rtc_time).now();
        if (now.is_valid()) {
          it.strftime(e1003::FOOTER_TIME_ANCHOR.x, e1003::FOOTER_TIME_ANCHOR.y,
                      id(font_tiny), BLACK,
                      e1003::FOOTER_TIME_ALIGN, e1003::FOOTER_TIME_FORMAT, now);
        }
      };

      if (id(ui_full_redraw)) {
        e1003::draw_rle_bitmap(it);
        draw_clock();
        draw_environment();
        draw_light();
        draw_footer();

        id(ui_full_redraw) = false;
        id(ui_time_dirty) = false;
        id(ui_env_dirty) = false;
        id(ui_light_dirty) = false;
        return;
      }

      if (id(ui_time_dirty)) {
        draw_clock();
        draw_footer();
        id(ui_time_dirty) = false;
      }

      if (id(ui_env_dirty)) {
        draw_environment();
        id(ui_env_dirty) = false;
      }

      if (id(ui_light_dirty)) {
        draw_light();
        draw_footer();
        id(ui_light_dirty) = false;
      }
