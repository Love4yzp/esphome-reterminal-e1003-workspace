# =============================================================================
# UI -- boot paint, refresh state machine and IT8951 render pass
# =============================================================================

esphome:
  # Files are copied into the build's src/ directory and included by basename.
  # Order matters: the bitmap first, then the header that consumes it.
  includes:
    - assets/dashboard_static_v4.h
    - layout/generated/ui_layout.h
    - src/e1003_render.h

  on_boot:
    priority: -100
    then:
      - component.update: sht4x_sensor
      - pcf8563.read_time:
      - delay: 3s
      - lambda: |-
          id(ui_full_redraw) = true;
      - it8951.update:
          id: epaper_display
          mode: ${refresh_boot_mode}
      - lambda: |-
          id(ui_ready) = true;

globals:
  - id: ui_ready
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ui_full_redraw
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: ui_network_dirty
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ui_network_signature
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: ui_wifi_signal_bars
    type: int
    restore_value: no
    initial_value: '0'

  - id: ui_env_dirty
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ui_light_dirty
    type: bool
    restore_value: no
    initial_value: 'false'

text_sensor:
  - platform: wifi_info
    ip_address:
      id: connected_wifi_ip
      internal: true
    ssid:
      id: connected_wifi_ssid
      internal: true

sensor:
  # RSSI is sampled independently from connectivity. Only a change between the
  # four visible signal levels marks the network card dirty.
  - platform: wifi_signal
    id: connected_wifi_signal
    internal: true
    update_interval: 30s
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                const int bars = e1003::wifi_signal_bars(x);
                if (bars == id(ui_wifi_signal_bars)) return false;
                id(ui_wifi_signal_bars) = bars;
                if (!id(ui_ready)) return false;
                id(ui_network_dirty) = true;
                return true;
            then:
              - script.execute: ui_refresh

interval:
  # Poll connectivity without refreshing the panel unless the visible state
  # actually changes. This also catches setup AP activation after timeout.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(ui_ready)) return false;

              const bool ap_active = wifi::global_wifi_component != nullptr
                  && wifi::global_wifi_component->is_ap_active();
              const bool wifi_connected = wifi::global_wifi_component != nullptr
                  && wifi::global_wifi_component->is_connected();
              const bool api_connected = api::global_api_server != nullptr
                  && api::global_api_server->is_connected();

              const std::string signature =
                  std::string(ap_active ? "ap|" : "sta|")
                  + (wifi_connected ? "1|" : "0|")
                  + (api_connected ? "1|" : "0|")
                  + id(connected_wifi_ssid).state
                  + "|"
                  + id(connected_wifi_ip).state;

              if (signature == id(ui_network_signature)) return false;
              id(ui_network_signature) = signature;
              id(ui_network_dirty) = true;
              return true;
          then:
            - script.execute: ui_refresh

script:
  # Sources mark a card dirty and call this script. Restart mode merges bursts
  # into one partial panel refresh.
  - id: ui_refresh
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(ui_ready) && !id(ui_full_redraw);
          then:
            - delay: ${refresh_settle_delay}
            - it8951.update:
                id: epaper_display
                mode: ${refresh_partial_mode}

  - id: ui_beep
    mode: restart
    then:
      - light.turn_on:
          id: ui_buzzer
          brightness: ${beep_brightness}
      - delay: ${beep_duration}
      - light.turn_off: ui_buzzer

  - id: ui_beep_long
    mode: restart
    then:
      - light.turn_on:
          id: ui_buzzer
          brightness: ${beep_brightness}
      - delay: 300ms
      - light.turn_off: ui_buzzer

  - id: ui_beep_warning
    mode: restart
    then:
      - light.turn_on:
          id: ui_buzzer
          brightness: ${beep_brightness}
      - delay: ${beep_duration}
      - light.turn_off: ui_buzzer
      - delay: 100ms
      - light.turn_on:
          id: ui_buzzer
          brightness: ${beep_brightness}
      - delay: ${beep_duration}
      - light.turn_off: ui_buzzer
      - delay: 100ms
      - light.turn_on:
          id: ui_buzzer
          brightness: ${beep_brightness}
      - delay: ${beep_duration}
      - light.turn_off: ui_buzzer

  - id: ui_repaint
    mode: restart
    then:
      - lambda: |-
          id(ui_full_redraw) = true;
      - it8951.update:
          id: epaper_display
          mode: ${refresh_boot_mode}

# The font list is generated from layout/ui_layout.yaml.
packages:
  fonts: !include ../layout/generated/fonts.yaml

display:
  - platform: it8951
    id: epaper_display
    spi_id: epaper_spi_bus
    model: ${epaper_model}

    update_interval: never
    auto_clear_enabled: false
    grayscale: true
    dithering: false
    update_mode: ${refresh_boot_mode}
    full_update_every: ${refresh_full_update_every}

    transform:
      mirror_x: true
      mirror_y: false

    lambda: |-
      static const Color BLACK = Color::BLACK;
      static const Color WHITE = Color::WHITE;
      const Color G2 = Color(e1003::G2, e1003::G2, e1003::G2);

      auto clear = [&](const e1003::Rect &r) {
        it.filled_rectangle(r.x, r.y, r.w, r.h, WHITE);
      };

      auto parse_uint = [](const std::string &text) -> int {
        int value = 0;
        for (const char c : text) {
          if (c < '0' || c > '9') break;
          value = value * 10 + (c - '0');
          if (value > 1000) break;
        }
        return value;
      };

      auto light_configured = [&]() -> bool {
        return !id(cfg_target_main_light).state.empty();
      };

      auto light_has_state = [&]() -> bool {
        const std::string state = id(cfg_state_main_light).state;
        return state == "on" || state == "off";
      };

      auto light_has_value = [&]() -> bool {
        return !id(cfg_value_main_light).state.empty();
      };

      auto light_on = [&]() -> bool {
        return id(cfg_state_main_light).state == "on";
      };

      auto light_pct = [&]() -> int {
        const std::string value_text = id(cfg_value_main_light).state;
        if (value_text.empty()) return 0;
        const int value = parse_uint(value_text);
        return value > 100 ? 100 : value;
      };

      auto fit_network_text = [&](const std::string &value,
                                  esphome::display::BaseFont *font,
                                  int max_width) -> std::string {
        std::string fitted = value;
        int x1 = 0;
        int y1 = 0;
        int width = 0;
        int height = 0;
        it.get_text_bounds(0, 0, fitted.c_str(), font,
                           esphome::display::TextAlign::TOP_LEFT,
                           &x1, &y1, &width, &height);
        while (width > max_width && fitted.size() > 4) {
          fitted.pop_back();
          const std::string candidate = fitted + "...";
          it.get_text_bounds(0, 0, candidate.c_str(), font,
                             esphome::display::TextAlign::TOP_LEFT,
                             &x1, &y1, &width, &height);
        }
        return fitted == value ? fitted : fitted + "...";
      };

      auto draw_network = [&]() {
        const bool ap_active = wifi::global_wifi_component != nullptr
            && wifi::global_wifi_component->is_ap_active();
        const bool wifi_connected = wifi::global_wifi_component != nullptr
            && wifi::global_wifi_component->is_connected();
        const bool api_connected = api::global_api_server != nullptr
            && api::global_api_server->is_connected();

        std::string ssid;
        std::string address;
        std::string ha_status;

        if (ap_active) {
          ssid = App.get_name().c_str();
          address = "IP 192.168.4.1";
          ha_status = "HA OFFLINE";
        } else if (wifi_connected) {
          ssid = id(connected_wifi_ssid).state;
          if (ssid.empty()) ssid = "CONNECTED WI-FI";
          const std::string ip = id(connected_wifi_ip).state;
          address = ip.empty() ? "IP PENDING" : "IP " + ip;
          ha_status = api_connected ? "HA CONNECTED" : "HA WAITING";
        } else {
          ssid = "FINDING WI-FI";
          address = "IP PENDING";
          ha_status = "HA OFFLINE";
        }

        clear(e1003::NETWORK_PANEL_CLEAR);
        const e1003::Rect ssid_box = e1003::NETWORK_PANEL_TRACK;
        const e1003::Rect ip_box = e1003::NETWORK_IP_CONTROL_TRACK;
        const e1003::Rect ha_box = e1003::NETWORK_HA_CONTROL_TRACK;
        const bool armed = id(wifi_reconfigure_armed) && !ap_active;

        if (armed) {
          it.filled_rectangle(ssid_box.x, ssid_box.y,
                              ssid_box.w, ssid_box.h, BLACK);
          it.printf(e1003::NETWORK_SSID_ANCHOR.x,
                    e1003::NETWORK_SSID_ANCHOR.y - 19,
                    id(font_small), WHITE,
                    e1003::NETWORK_SSID_ALIGN, "%s", "CHANGE WI-FI?");
          it.printf(e1003::NETWORK_SSID_ANCHOR.x,
                    e1003::NETWORK_SSID_ANCHOR.y + 18,
                    id(font_tiny), WHITE,
                    e1003::NETWORK_SSID_ALIGN, "%s", "TAP AGAIN TO CONFIRM");
        } else {
          it.rectangle(ssid_box.x, ssid_box.y,
                       ssid_box.w, ssid_box.h, BLACK);

          if (ap_active) {
            const int badge_x = e1003::NETWORK_SSID_ANCHOR.x - 22;
            const int badge_y = e1003::NETWORK_SSID_ANCHOR.y - 60;
            it.rectangle(badge_x, badge_y, 44, 26, BLACK);
            it.printf(e1003::NETWORK_SSID_ANCHOR.x,
                      badge_y + 13,
                      id(font_tiny), BLACK,
                      esphome::display::TextAlign::CENTER, "%s", "AP");
          } else {
            const int signal_x = e1003::NETWORK_SSID_ANCHOR.x - 18;
            const int signal_bottom = e1003::NETWORK_SSID_ANCHOR.y - 35;
            const int filled_bars =
                wifi_connected ? id(ui_wifi_signal_bars) : 0;
            for (int index = 0; index < 4; index++) {
              const int height = 7 + index * 6;
              const int bar_x = signal_x + index * 10;
              const int bar_y = signal_bottom - height;
              if (index < filled_bars) {
                it.filled_rectangle(bar_x, bar_y, 6, height, BLACK);
              } else {
                it.rectangle(bar_x, bar_y, 6, height, BLACK);
              }
            }
          }

          ssid = fit_network_text(ssid, id(font_small), ssid_box.w - 24);
          it.printf(e1003::NETWORK_SSID_ANCHOR.x,
                    e1003::NETWORK_SSID_ANCHOR.y,
                    id(font_small), BLACK,
                    e1003::NETWORK_SSID_ALIGN, "%s", ssid.c_str());
        }

        it.rectangle(ip_box.x, ip_box.y, ip_box.w, ip_box.h, BLACK);
        address = fit_network_text(address, id(font_small), ip_box.w - 24);
        it.printf(e1003::NETWORK_IP_ANCHOR.x,
                  e1003::NETWORK_IP_ANCHOR.y,
                  id(font_small), BLACK,
                  e1003::NETWORK_IP_ALIGN, "%s", address.c_str());

        it.rectangle(ha_box.x, ha_box.y, ha_box.w, ha_box.h, BLACK);
        it.printf(e1003::NETWORK_HA_ANCHOR.x,
                  e1003::NETWORK_HA_ANCHOR.y,
                  id(font_small), BLACK,
                  e1003::NETWORK_HA_ALIGN, "%s", ha_status.c_str());

        id(ui_network_signature) =
            std::string(ap_active ? "ap|" : "sta|")
            + (wifi_connected ? "1|" : "0|")
            + (api_connected ? "1|" : "0|")
            + id(connected_wifi_ssid).state
            + "|"
            + id(connected_wifi_ip).state;
      };

      auto draw_environment = [&]() {
        clear(e1003::ENV_TEMPERATURE_CLEAR);
        if (id(sht4x_temperature).has_state()) {
          it.printf(e1003::ENV_TEMPERATURE_ANCHOR.x, e1003::ENV_TEMPERATURE_ANCHOR.y,
                    id(font_large), BLACK,
                    e1003::ENV_TEMPERATURE_ALIGN, e1003::ENV_TEMPERATURE_FORMAT,
                    id(sht4x_temperature).state);
        } else {
          it.printf(e1003::ENV_TEMPERATURE_ANCHOR.x, e1003::ENV_TEMPERATURE_ANCHOR.y,
                    id(font_large), BLACK,
                    e1003::ENV_TEMPERATURE_ALIGN, "%s", "--");
        }

        clear(e1003::ENV_HUMIDITY_CLEAR);
        if (id(sht4x_humidity).has_state()) {
          it.printf(e1003::ENV_HUMIDITY_ANCHOR.x, e1003::ENV_HUMIDITY_ANCHOR.y,
                    id(font_large), BLACK,
                    e1003::ENV_HUMIDITY_ALIGN, e1003::ENV_HUMIDITY_FORMAT,
                    id(sht4x_humidity).state);
        } else {
          it.printf(e1003::ENV_HUMIDITY_ANCHOR.x, e1003::ENV_HUMIDITY_ANCHOR.y,
                    id(font_large), BLACK,
                    e1003::ENV_HUMIDITY_ALIGN, "%s", "--");
        }
      };

      auto draw_light = [&]() {
        const bool configured = light_configured();
        const bool has_state = light_has_state();
        const bool has_display_data =
            configured || has_state || light_has_value();
        const bool on = light_on();
        const int pct = light_pct();

        clear(e1003::LIGHT_STATE_CONTROL_CLEAR);
        const e1003::Rect state = e1003::LIGHT_STATE_CONTROL_TRACK;
        const int state_half = state.w / 2;
        it.rectangle(state.x, state.y, state.w, state.h, BLACK);
        it.vertical_line(state.x + state_half, state.y, state.h, BLACK);
        if (has_state) {
          const int active_x = on ? state.x + state_half + 1 : state.x + 1;
          const int active_w = on ? state.w - state_half - 2 : state_half - 1;
          it.filled_rectangle(active_x, state.y + 1, active_w, state.h - 2, BLACK);
        }

        it.printf(e1003::LIGHT_OFF_LABEL_ANCHOR.x, e1003::LIGHT_OFF_LABEL_ANCHOR.y,
                  id(font_medium), has_state && !on ? WHITE : BLACK,
                  e1003::LIGHT_OFF_LABEL_ALIGN, "%s", "OFF");
        it.printf(e1003::LIGHT_ON_LABEL_ANCHOR.x, e1003::LIGHT_ON_LABEL_ANCHOR.y,
                  id(font_medium), has_state && on ? WHITE : BLACK,
                  e1003::LIGHT_ON_LABEL_ALIGN, "%s", "ON");

        clear(e1003::LIGHT_CURRENT_CLEAR);
        if (has_display_data) {
          it.printf(e1003::LIGHT_CURRENT_ANCHOR.x, e1003::LIGHT_CURRENT_ANCHOR.y,
                    id(font_tiny), BLACK,
                    e1003::LIGHT_CURRENT_ALIGN, "Current %d%%", pct);
        } else {
          it.printf(e1003::LIGHT_CURRENT_ANCHOR.x, e1003::LIGHT_CURRENT_ANCHOR.y,
                    id(font_tiny), BLACK,
                    e1003::LIGHT_CURRENT_ALIGN, "%s", "Not configured");
        }

        auto draw_preset = [&](const e1003::Rect &clear_rect,
                               const e1003::Rect &button,
                               const e1003::Point &anchor,
                               esphome::display::TextAlign align,
                               int value,
                               const char *label) {
          clear(clear_rect);
          const bool active = has_state && on && pct == value;
          if (active) {
            it.filled_rectangle(button.x, button.y, button.w, button.h, BLACK);
          } else {
            it.rectangle(button.x, button.y, button.w, button.h, BLACK);
          }
          it.printf(anchor.x, anchor.y, id(font_medium),
                    active ? WHITE : BLACK, align, "%s", label);
        };

        draw_preset(e1003::LIGHT_PRESET_25_CLEAR,
                    e1003::LIGHT_PRESET_25_TRACK,
                    e1003::LIGHT_PRESET_25_LABEL_ANCHOR,
                    e1003::LIGHT_PRESET_25_LABEL_ALIGN, 25, "25%");
        draw_preset(e1003::LIGHT_PRESET_50_CLEAR,
                    e1003::LIGHT_PRESET_50_TRACK,
                    e1003::LIGHT_PRESET_50_LABEL_ANCHOR,
                    e1003::LIGHT_PRESET_50_LABEL_ALIGN, 50, "50%");
        draw_preset(e1003::LIGHT_PRESET_75_CLEAR,
                    e1003::LIGHT_PRESET_75_TRACK,
                    e1003::LIGHT_PRESET_75_LABEL_ANCHOR,
                    e1003::LIGHT_PRESET_75_LABEL_ALIGN, 75, "75%");
        draw_preset(e1003::LIGHT_PRESET_100_CLEAR,
                    e1003::LIGHT_PRESET_100_TRACK,
                    e1003::LIGHT_PRESET_100_LABEL_ANCHOR,
                    e1003::LIGHT_PRESET_100_LABEL_ALIGN, 100, "100%");

        clear(e1003::LIGHT_SLIDER_CLEAR);
        const e1003::Rect track = e1003::LIGHT_SLIDER_TRACK;
        it.filled_rectangle(track.x, track.y, track.w, track.h, G2);
        const int filled = (track.w - 1) * pct / 100;
        if (has_display_data && filled > 0) {
          it.filled_rectangle(track.x, track.y, filled + 1, track.h, BLACK);
        }

        const int thumb_x = track.x + filled;
        const int thumb_y = track.y + track.h / 2;
        const int thumb_radius = track.h;
        it.filled_circle(thumb_x, thumb_y, thumb_radius, WHITE);
        it.circle(thumb_x, thumb_y, thumb_radius, BLACK);
        if (has_display_data) {
          it.filled_circle(thumb_x, thumb_y, thumb_radius / 3, BLACK);
        }
      };

      auto draw_footer = [&]() {
        const e1003::Rect footer = e1003::FOOTER_TIME_CLEAR;
        it.filled_rectangle(footer.x, footer.y, footer.w, footer.h, WHITE);

        auto now = id(rtc_time).now();
        if (now.is_valid()) {
          it.strftime(e1003::FOOTER_TIME_ANCHOR.x, e1003::FOOTER_TIME_ANCHOR.y,
                      id(font_tiny), BLACK,
                      e1003::FOOTER_TIME_ALIGN, e1003::FOOTER_TIME_FORMAT, now);
        }
      };

      if (id(ui_full_redraw)) {
        e1003::draw_rle_bitmap(it);
        draw_network();
        draw_environment();
        draw_light();
        draw_footer();

        id(ui_full_redraw) = false;
        id(ui_network_dirty) = false;
        id(ui_env_dirty) = false;
        id(ui_light_dirty) = false;
        return;
      }

      bool drew_partial = false;

      if (id(ui_network_dirty)) {
        draw_network();
        id(ui_network_dirty) = false;
        drew_partial = true;
      }

      if (id(ui_env_dirty)) {
        draw_environment();
        id(ui_env_dirty) = false;
        drew_partial = true;
      }

      if (id(ui_light_dirty)) {
        draw_light();
        id(ui_light_dirty) = false;
        drew_partial = true;
      }

      if (drew_partial) {
        draw_footer();
      }
