# ESPHome secrets 模板
#
# 使用方法:
#   1. 复制本文件为 secrets.yaml
#   2. 填入你自己的真实值(secrets.yaml 已被 .gitignore 排除,不会提交到 git)
#
#   - ota 复用 api_encryption_key,无需单独的 OTA 密码
#   - ap_password 是 Wi-Fi 连不上时回退热点的密码
#
#   生成 api_encryption_key:
#     python -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"

wifi_ssid: "your_wifi_ssid"
wifi_password: "your_wifi_password"
# AP hotspot password used when Wi-Fi is unreachable
ap_password: "change_me_ap"

api_encryption_key: "base64_encoded_32_byte_key_here"